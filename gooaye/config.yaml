# 股癌蒸餾管線設定（試跑階段）

# 20 集分層試跑樣本：每年約 3 集，含 2020-03 熔斷、2022 空頭、2025-04 關稅股災、2025-10 稀土崩盤。
# 刻意避開 holdout 區間（EP676 之後，評測模型訓練截止日之後）。
# EP547 談到家人健康 → 用來測試隱私過濾。
pilot_eps: [10, 45, 60, 130, 170, 200, 240, 255, 290, 330, 370, 400, 440, 470, 510, 547, 549, 600, 640, 670]

holdout_from_ep: 676

extract:
  # 試跑時三個模型都跑同一批，比較後再決定全量用哪個
  models: [claude-opus-5-5, claude-sonnet-5-5, claude-haiku-4-5]
  effort: medium          # Opus 5.5 / Sonnet 5.5 用；Haiku 4.5 不支援 effort
  max_tokens: 32000

# 美元 / 每百萬 token（標準價；Batch 為半價）
pricing:
  claude-opus-5-5: {input: 4.0, output: 20.0}
  claude-sonnet-5-5: {input: 2.0, output: 10.0}
  claude-haiku-4-5: {input: 1.0, output: 5.0}

validate:
  fuzzy_threshold: 90     # rapidfuzz partial_ratio，低於此值的引文視為不存在
  max_drop_rate: 0.05     # 單集丟卡率超過就重跑

# 外部資料 repo（私人）：卡片、進度、校準結果都存這裡，不進公開 repo
data_repo: /home/user/gooaye-data

# 時期切分（S4/S8 分階段用；可依轉折點微調）
periods:
  "2020-21": [1, 205]
  "2022": [206, 310]
  "2023-24": [311, 518]
  "2025-26": [519, 675]

# 預測測試保留集：各時期隨機 15%（seed 42）。照常萃取，但 S4/S8 建模時排除，只用來驗證心智模型。
predict_holdout:
  "2020-21": [7, 8, 9, 23, 24, 27, 29, 36, 51, 56, 57, 58, 63, 71, 108, 109, 115, 140, 144, 152, 155, 164, 167, 174, 189, 190, 193, 202, 203]
  "2022": [206, 217, 218, 219, 225, 226, 233, 241, 249, 251, 254, 260, 281, 295, 303, 309]
  "2023-24": [322, 328, 331, 336, 342, 360, 369, 378, 382, 385, 386, 399, 403, 404, 407, 408, 427, 428, 448, 452, 458, 465, 469, 471, 473, 480, 491, 497, 509, 515]
  "2025-26": [527, 533, 535, 537, 560, 562, 572, 573, 575, 577, 581, 587, 588, 599, 602, 609, 613, 616, 621, 637, 655, 661, 671, 675]

# session 內萃取的模型分派（子 agent 的 model 參數）；校準後可調整
in_session_assignment:
  "2020-21": haiku
  "2022": haiku
  "2023-24": sonnet
  "2025-26": sonnet
  holdout_eval: sonnet   # EP676 之後
